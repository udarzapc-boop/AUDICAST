<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full P2P Live Audio Stream & Request-Accept App</title>
    <!-- PeerJS Library for WebRTC Connection & Media Streaming -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
        
        .container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
        header { text-align: center; margin-bottom: 4px; }
        header h1 { font-size: 1.3rem; font-weight: 700; }
        header p { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }

        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .card-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--accent); color: white; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px var(--accent-glow); }
        .btn:hover { opacity: 0.9; }
        .btn-success { background: var(--success); box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
        .btn-secondary { background: #334155; box-shadow: none; }

        .device-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; margin-top: 8px; }
        .device-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 10px 12px; border-radius: 10px; font-size: 0.85rem; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
        .badge.online { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge.pending { background: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.3); }

        .input-box { width:100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-bottom: 12px; font-size: 0.9rem; text-align: center; font-weight: bold; }
        .file-input-wrapper { border: 2px dashed #475569; padding: 14px; text-align: center; border-radius: 10px; cursor: pointer; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-sub); }
        .file-input-wrapper input { display: none; }
        
        audio { width: 100%; margin-top: 8px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Wi-Fi Live Audio Streamer</h1>
        <p>Request-Accept & Real WebRTC Audio Sync</p>
    </header>

    <!-- Role Selection -->
    <div class="card" style="display: flex; gap: 10px;">
        <button id="btnRoleHost" class="btn" style="flex:1;">I am Host (Laptop)</button>
        <button id="btnRoleClient" class="btn btn-secondary" style="flex:1;">I am Client (Phone)</button>
    </div>

    <!-- Host Dashboard -->
    <div id="hostDashboard" class="card">
        <div class="card-title">
            <span>Host Control Panel</span>
            <span id="hostStatus" class="badge pending">Initializing...</span>
        </div>

        <label style="font-size: 0.85rem; color: var(--text-sub);">Room Name (Share with phone):</label>
        <input type="text" id="hostRoomInput" class="input-box" value="my-music-room">
        <button id="btnUpdateRoom" class="btn" style="margin-bottom: 12px; padding: 8px;">Apply Room Name</button>

        <label class="file-input-wrapper">
            <span id="fileName">Select Audio File (.mp3)</span>
            <input type="file" id="audioFile" accept="audio/*">
        </label>
        <audio id="hostAudio" controls style="display:none;"></audio>

        <div class="card-title" style="margin-top: 16px; margin-bottom: 6px;">
            <span>Incoming Connection Requests</span>
        </div>
        <div class="device-list" id="requestsList">
            <div style="font-size: 0.8rem; color: var(--text-sub); text-align: center; padding: 6px;">No requests yet...</div>
        </div>

        <div class="card-title" style="margin-top: 16px; margin-bottom: 6px;">
            <span>Connected & Streaming Devices</span>
        </div>
        <div class="device-list" id="connectedList">
            <div class="device-item">
                <span>💻 Host Laptop</span>
                <span class="badge online">Active</span>
            </div>
        </div>
    </div>

    <!-- Client Dashboard -->
    <div id="clientDashboard" class="card" style="display: none;">
        <div class="card-title">
            <span>Client Receiver Panel</span>
            <span id="clientStatus" class="badge pending">Disconnected</span>
        </div>
        
        <label style="font-size: 0.85rem; color: var(--text-sub);">Host Room Name:</label>
        <input type="text" id="clientRoomInput" class="input-box" value="my-music-room">

        <label style="font-size: 0.85rem; color: var(--text-sub);">Your Device Name:</label>
        <input type="text" id="clientNameInput" class="input-box" value="My Phone Earbud">

        <button id="btnSendRequest" class="btn">Send Request to Host</button>
        
        <div id="clientPlayerContainer" style="display: none; margin-top: 14px; text-align: center;">
            <p style="font-size: 0.85rem; color: var(--success); margin-bottom: 8px;">✔ Host Accepted! Live Audio Streaming:</p>
            <audio id="clientAudio" autoplay controls></audio>
        </div>
    </div>
</div>

<script>
    const btnRoleHost = document.getElementById('btnRoleHost');
    const btnRoleClient = document.getElementById('btnRoleClient');
    const hostDashboard = document.getElementById('hostDashboard');
    const clientDashboard = document.getElementById('clientDashboard');

    const hostRoomInput = document.getElementById('hostRoomInput');
    const btnUpdateRoom = document.getElementById('btnUpdateRoom');
    const hostStatus = document.getElementById('hostStatus');
    const audioFileInput = document.getElementById('audioFile');
    const fileName = document.getElementById('fileName');
    const hostAudio = document.getElementById('hostAudio');
    
    const clientRoomInput = document.getElementById('clientRoomInput');
    const clientNameInput = document.getElementById('clientNameInput');
    const btnSendRequest = document.getElementById('btnSendRequest');
    const clientStatus = document.getElementById('clientStatus');
    const clientPlayerContainer = document.getElementById('clientPlayerContainer');
    const requestsList = document.getElementById('requestsList');
    const connectedList = document.getElementById('connectedList');
    const clientAudio = document.getElementById('clientAudio');

    let hostPeer = null;
    let clientPeer = null;
    let pendingClients = {}; 
    let activeCalls = [];

    // Toggle Views
    btnRoleHost.addEventListener('click', () => {
        hostDashboard.style.display = 'block';
        clientDashboard.style.display = 'none';
        btnRoleHost.className = 'btn';
        btnRoleClient.className = 'btn btn-secondary';
        initHost();
    });

    btnRoleClient.addEventListener('click', () => {
        hostDashboard.style.display = 'none';
        clientDashboard.style.display = 'block';
        btnRoleClient.className = 'btn';
        btnRoleHost.className = 'btn btn-secondary';
    });

    // Initialize Host Peer
    function initHost() {
        if(hostPeer) hostPeer.destroy();
        const roomName = hostRoomInput.value.trim();
        hostPeer = new Peer('wifi-live-audio-' + roomName);

        hostPeer.on('open', () => {
            hostStatus.className = 'badge online';
            hostStatus.textContent = 'Room Ready';
        });

        hostPeer.on('error', () => {
            hostStatus.textContent = 'Room Name Taken / Error';
            alert("Room name might already be in use. Try a unique room name.");
        });

        hostPeer.on('connection', (conn) => {
            conn.on('data', (data) => {
                if(data.type === 'request-join') {
                    pendingClients[conn.peer] = { conn: conn, name: data.name };
                    updateRequestsUI();
                }
            });

            conn.on('close', () => {
                delete pendingClients[conn.peer];
                updateRequestsUI();
            });
        });
    }

    btnUpdateRoom.addEventListener('click', () => {
        initHost();
        alert("Host room updated successfully!");
    });

    function updateRequestsUI() {
        const keys = Object.keys(pendingClients);
        if(keys.length === 0) {
            requestsList.innerHTML = `<div style="font-size: 0.8rem; color: var(--text-sub); text-align: center; padding: 6px;">No requests yet...</div>`;
            return;
        }
        requestsList.innerHTML = '';
        keys.forEach(peerId => {
            const client = pendingClients[peerId];
            const div = document.createElement('div');
            div.className = 'device-item';
            div.innerHTML = `<span>📱 ${client.name}</span><button class="btn btn-success" style="width: auto; padding: 6px 12px; font-size: 0.75rem;" onclick="acceptClient('${peerId}')">Accept</button>`;
            requestsList.appendChild(div);
        });
    }

    // Host Accepts Client Request & Initiates WebRTC Audio Stream Call
    window.acceptClient = function(peerId) {
        const client = pendingClients[peerId];
        if(client) {
            client.conn.send({ type: 'approved' });

            if(hostAudio.captureStream || hostAudio.mozCaptureStream) {
                const audioStream = hostAudio.captureStream ? hostAudio.captureStream() : hostAudio.mozCaptureStream();
                const call = hostPeer.call(peerId, audioStream);
                activeCalls.push(call);
            } else {
                alert("Browser does not support audio stream capture!");
            }

            const div = document.createElement('div');
            div.className = 'device-item';
            div.innerHTML = `<span>📱 ${client.name}</span><span class="badge online">Live Streaming</span>`;
            connectedList.appendChild(div);

            delete pendingClients[peerId];
            updateRequestsUI();
        }
    }

    // Audio file selection
    audioFileInput.addEventListener('change', (e) => {
        if(e.target.files.length > 0) {
            const file = e.target.files[0];
            fileName.textContent = `File: ${file.name}`;
            hostAudio.style.display = 'block';
            hostAudio.src = URL.createObjectURL(file);
        }
    });

    // Client Connection & Request
    btnSendRequest.addEventListener('click', () => {
        const roomName = clientRoomInput.value.trim();
        const clientName = clientNameInput.value.trim();

        clientStatus.className = 'badge pending';
        clientStatus.textContent = 'Connecting...';

        if(clientPeer) clientPeer.destroy();
        clientPeer = new Peer();

        clientPeer.on('open', () => {
            const hostPeerId = 'wifi-live-audio-' + roomName;
            const conn = clientPeer.connect(hostPeerId);

            conn.on('open', () => {
                clientStatus.textContent = 'Waiting Approval...';
                conn.send({ type: 'request-join', name: clientName });
                alert("Request sent to Host! Please wait for acceptance.");
            });

            conn.on('data', (data) => {
                if(data.type === 'approved') {
                    clientStatus.className = 'badge online';
                    clientStatus.textContent = 'Connected Live';
                    clientPlayerContainer.style.display = 'block';
                }
            });

            conn.on('error', () => {
                clientStatus.className = 'badge pending';
                clientStatus.textContent = 'Room Not Found';
                alert("Could not connect to host room. Check room name!");
            });
        });

        // Listen for incoming WebRTC audio stream call from Host
        clientPeer.on('call', (call) => {
            call.answer(); 
            call.on('stream', (remoteStream) => {
                clientAudio.srcObject = remoteStream;
                clientAudio.play().catch(e => console.log("Autoplay waiting for interaction"));
            });
        });
    });

    initHost();
</script>

</body>
</html>
