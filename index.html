<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Real-time Audio Sync & Monitor</title>
    <!-- PeerJS Library for Real-time P2P Connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
        
        .container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
        header { text-align: center; margin-bottom: 4px; }
        header h1 { font-size: 1.3rem; font-weight: 700; }
        header p { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }

        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .card-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--accent); color: white; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px var(--accent-glow); }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: #334155; box-shadow: none; }
        .btn-danger { background: #dc2626; box-shadow: none; }

        .device-list { display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; margin-top: 8px; }
        .device-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 10px 12px; border-radius: 10px; font-size: 0.85rem; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
        .badge.online { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge.offline { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .dot { width: 6px; height: 6px; border-radius: 50%; background-color: currentColor; }

        .input-box { width:100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-bottom: 12px; font-size: 0.9rem; text-align: center; letter-spacing: 1px; font-weight: bold; }
        .file-input-wrapper { border: 2px dashed #475569; padding: 14px; text-align: center; border-radius: 10px; cursor: pointer; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-sub); }
        .file-input-wrapper input { display: none; }
        
        audio { width: 100%; margin-top: 8px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>P2P Audio Mesh App</h1>
        <p>Real-time Sync & Device Monitor</p>
    </header>

    <!-- Mode Selector -->
    <div class="card" style="display: flex; gap: 10px;">
        <button id="btnModeHost" class="btn" style="flex:1;">Host Session</button>
        <button id="btnModeClient" class="btn btn-secondary" style="flex:1;">Join as Client</button>
    </div>

    <!-- Host Dashboard View -->
    <div id="hostView" class="card">
        <div class="card-title">
            <span>Host Controller</span>
            <span id="hostStatusBadge" class="badge offline"><span class="dot"></span>Initializing...</span>
        </div>

        <div style="margin-bottom: 12px; font-size: 0.85rem; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; text-align: center;">
            Your Room ID: <strong id="displayRoomId" style="color: #38bdf8; font-size: 1rem;">Generating...</strong>
        </div>

        <label class="file-input-wrapper">
            <span id="fileName">Select Audio File (.mp3)</span>
            <input type="file" id="audioFile" accept="audio/*">
        </label>

        <audio id="audioPlayer" controls style="display:none;"></audio>

        <div class="card-title" style="margin-top: 16px; margin-bottom: 6px;">
            <span>Connected Devices Monitor</span>
            <span id="deviceCount" style="font-size:0.75rem; color:var(--text-sub);">0 Connected</span>
        </div>
        <div class="device-list" id="deviceList">
            <div style="font-size: 0.8rem; color: var(--text-sub); text-align: center; padding: 10px;">Waiting for clients to join...</div>
        </div>
    </div>

    <!-- Client View (Hidden by Default) -->
    <div id="clientView" class="card" style="display: none;">
        <div class="card-title">
            <span>Client Receiver Mode</span>
            <span id="clientStatusBadge" class="badge offline"><span class="dot"></span>Disconnected</span>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px;">Enter Host Room ID:</p>
        <input type="text" id="roomIdInput" class="input-box" placeholder="Enter Room ID here">
        <button id="btnConnectHost" class="btn">Connect to Room</button>
        
        <div style="margin-top: 14px; text-align: center;">
            <audio id="clientAudioPlayer" controls style="width:100%;"></audio>
        </div>
    </div>
</div>

<script>
    const btnModeHost = document.getElementById('btnModeHost');
    const btnModeClient = document.getElementById('btnModeClient');
    const hostView = document.getElementById('hostView');
    const clientView = document.getElementById('clientView');
    
    const hostStatusBadge = document.getElementById('hostStatusBadge');
    const displayRoomId = document.getElementById('displayRoomId');
    const audioFileInput = document.getElementById('audioFile');
    const fileNameDisplay = document.getElementById('fileName');
    const audioPlayer = document.getElementById('audioPlayer');
    const clientAudioPlayer = document.getElementById('clientAudioPlayer');
    
    const roomIdInput = document.getElementById('roomIdInput');
    const btnConnectHost = document.getElementById('btnConnectHost');
    const clientStatusBadge = document.getElementById('clientStatusBadge');
    const deviceList = document.getElementById('deviceList');
    const deviceCount = document.getElementById('deviceCount');

    let peer, connectedClients = [];
    let hostPeerId = '';
    let clientConnection = null;

    // Toggle Views
    btnModeHost.addEventListener('click', () => {
        hostView.style.display = 'block';
        clientView.style.display = 'none';
        btnModeHost.className = 'btn';
        btnModeClient.className = 'btn btn-secondary';
        initHostPeer();
    });

    btnModeClient.addEventListener('click', () => {
        hostView.style.display = 'none';
        clientView.style.display = 'block';
        btnModeClient.className = 'btn';
        btnModeHost.className = 'btn btn-secondary';
        if(!peer) peer = new Peer();
    });

    // 1. Initialize Host Peer
    function initHostPeer() {
        if (peer) peer.destroy();
        peer = new Peer(); // Random free peer id

        peer.on('open', (id) => {
            hostPeerId = id;
            displayRoomId.textContent = id;
            hostStatusBadge.className = 'badge online';
            hostStatusBadge.innerHTML = '<span class="dot"></span>Ready (Hosting)';
        });

        peer.on('connection', (conn) => {
            connectedClients.push(conn);
            updateDeviceMonitor();

            conn.on('data', (data) => {
                console.log("Data from client:", data);
            });

            conn.on('close', () => {
                connectedClients = connectedClients.filter(c => c !== conn);
                updateDeviceMonitor();
            });
        });
    }

    // Update Host Connected Devices List
    function updateDeviceMonitor() {
        deviceCount.textContent = `${connectedClients.length} Connected`;
        if (connectedClients.length === 0) {
            deviceList.innerHTML = `<div style="font-size: 0.8rem; color: var(--text-sub); text-align: center; padding: 10px;">Waiting for clients to join...</div>`;
            return;
        }
        deviceList.innerHTML = '';
        connectedClients.forEach((client, index) => {
            const div = document.createElement('div');
            div.className = 'device-item';
            div.innerHTML = `<span>📱 Client Device #${index + 1} (${client.peer.substr(0,5)}...)</span><span class="badge online"><span class="dot"></span>Synced</span>`;
            deviceList.appendChild(div);
        });
    }

    // Host Audio Selection
    audioFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(file) {
            fileNameDisplay.textContent = `File: ${file.name}`;
            const fileURL = URL.createObjectURL(file);
            audioPlayer.style.display = 'block';
            audioPlayer.src = fileURL;

            // Broadcast audio file as Blob url or data to clients
            audioPlayer.onplay = () => broadcastCommand({ type: 'play', time: audioPlayer.currentTime });
            audioPlayer.onpause = () => broadcastCommand({ type: 'pause', time: audioPlayer.currentTime });
            audioPlayer.onseeked = () => broadcastCommand({ type: 'seek', time: audioPlayer.currentTime });
        }
    });

    function broadcastCommand(data) {
        connectedClients.forEach(client => {
            client.send(data);
        });
    }

    // 2. Client Connection Logic
    btnConnectHost.addEventListener('click', () => {
        const roomId = roomIdInput.value.trim();
        if(!roomId) {
            alert("Please enter a valid Room ID!");
            return;
        }

        clientStatusBadge.className = 'badge online';
        clientStatusBadge.innerHTML = '<span class="dot"></span>Connecting...';

        clientConnection = peer.connect(roomId);

        clientConnection.on('open', () => {
            clientStatusBadge.className = 'badge online';
            clientStatusBadge.innerHTML = '<span class="dot"></span>Connected to Host!';
            alert("Successfully connected to Host Room!");
        });

        clientConnection.on('data', (data) => {
            if (data.type === 'play') {
                clientAudioPlayer.play();
            } else if (data.type === 'pause') {
                clientAudioPlayer.pause();
            } else if (data.type === 'seek') {
                clientAudioPlayer.currentTime = data.time;
            }
        });

        clientConnection.on('close', () => {
            clientStatusBadge.className = 'badge offline';
            clientStatusBadge.innerHTML = '<span class="dot"></span>Disconnected';
            alert("Disconnected from Host.");
        });
    });

    // Initial load start host
    initHostPeer();
</script>

</body>
</html>
